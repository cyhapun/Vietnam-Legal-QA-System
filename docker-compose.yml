version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: vietlaw
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      STORAGE_BACKEND: qdrant_postgres
      POSTGRES_DSN: postgresql://postgres:postgres@postgres:5432/vietlaw
      QDRANT_URL: http://qdrant:6333
      HUGGINGFACE_API_KEY: ${HUGGINGFACE_API_KEY:-}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-huggingface}
    volumes:
      - ./backend/data:/app/data
      - ./backend/vietlaw_faiss_index:/app/vietlaw_faiss_index
      - ./backend/embedded_files.json:/app/embedded_files.json
      # Ánh xạ thư mục cache của HuggingFace ra ngoài để không phải tải lại model
      - hf_cache:/root/.cache/huggingface
    depends_on:
      - postgres
      - qdrant

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    environment:
      BACKEND_URL: http://backend:8000
    depends_on:
      - backend

volumes:
  postgres_data:
  qdrant_data:
  hf_cache:
